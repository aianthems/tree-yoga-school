version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
